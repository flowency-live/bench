version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - corepack enable
            - corepack prepare pnpm@11.1.3 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - cd ../..
            - pnpm turbo run build --filter=@bench/web
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
