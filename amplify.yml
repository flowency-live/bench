version: 1
appRoot: apps/web
frontend:
  phases:
    preBuild:
      commands:
        # Enable pnpm via corepack (built into Node 18+)
        - corepack enable
        - corepack prepare pnpm@11.1.3 --activate
        # Install from monorepo root
        - cd ../.. && pnpm install --frozen-lockfile
        # Build workspace dependencies first (types, data, domain, ui)
        - cd ../.. && pnpm turbo run build --filter=@bench/web^...
    build:
      commands:
        # Build the Next.js app
        - cd ../.. && pnpm turbo run build --filter=@bench/web
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
      - .next/cache/**/*
