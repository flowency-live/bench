version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Enable pnpm via corepack (built into Node 18+)
        - corepack enable
        - corepack prepare pnpm@11.1.3 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm --filter @bench/web build
  artifacts:
    baseDirectory: apps/web/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/.next/cache/**/*
