version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@11.1.3 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm turbo run build --filter=@bench/web
  artifacts:
    baseDirectory: apps/web
    files:
      - '.next/**/*'
      - 'public/**/*'
      - 'package.json'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/.next/cache/**/*
